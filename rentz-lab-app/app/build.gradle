plugins { id 'com.android.application' }
android {
    namespace 'ro.rentzlab.app'
    compileSdk 36
    defaultConfig { applicationId 'ro.rentzlab.app'; minSdk 26; targetSdk 36; versionCode 25; versionName '0.21.0' }
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            def store = System.getenv('RENTZ_STORE_FILE')
            if (store) {
                storeFile file(store)
                storePassword System.getenv('RENTZ_STORE_PASSWORD')
                keyAlias 'rentzlab-release'
                keyPassword System.getenv('RENTZ_STORE_PASSWORD')
            }
        }
    }
    buildTypes {
        uiSanity {
            initWith debug
            applicationIdSuffix '.uisanity'
            versionNameSuffix '-ui-sanity'
            matchingFallbacks = ['debug']
        }
        release {
            debuggable false
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions.unitTests.all {
        systemProperty 'rentz.uiRepository', rootProject.file('ui-library').absolutePath
        def evidence = providers.gradleProperty('rentz.uiEvidence').orNull
        if (evidence) systemProperty 'rentz.uiEvidence', rootProject.file(evidence).absolutePath
    }
}
tasks.register('validateReleaseSigning') {
    doLast {
        if (!System.getenv('RENTZ_STORE_FILE') || !System.getenv('RENTZ_STORE_PASSWORD')) {
            throw new GradleException('Release signing identity must be supplied externally; no unsigned delivery.')
        }
    }
}
tasks.configureEach {
    if (name == 'preReleaseBuild') { dependsOn tasks.named('validateReleaseSigning') }
}
dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation project(':game-core')
    implementation 'ro.cardtable:card-table-ui:0.1.11'
    implementation 'ro.cardtable:card-table-names:0.1.0'
    implementation 'com.google.code.gson:gson:2.11.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240205'
    testImplementation 'com.google.code.gson:gson:2.11.0'
}
apply from: 'achievement-catalog.gradle'

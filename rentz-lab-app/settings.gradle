pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        exclusiveContent {
            forRepository { maven { url=uri('ui-library') } }
            filter { includeGroup 'ro.cardtable' }
        }
        def localRepository=providers.gradleProperty('rentz.mavenRepository').orNull
        if(localRepository) { maven { url=uri(localRepository) } }
        google(); mavenCentral()
    }
}
rootProject.name = 'RentzLab'
include ':game-core'
include ':app'
